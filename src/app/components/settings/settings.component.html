<div class="page-header">
  <div>
    <h2 class="md-0">Settings</h2>
    <p class="page-subtitle">Manage your profile, avatar and password.</p>
  </div>
</div>

<div class="row g-3">

  <!-- Profile -->
  <div class="col-12 col-lg-7">
    <div class="section-card">
      <div class="section-card-header">
        <i class="bi bi-person-circle"></i>
        <h6>Profile</h6>
      </div>
      <div class="section-card-body">

        <!-- Avatar -->
        <div class="avatar-uploader mb-4">
          @if (avatarPreview) {
            <img [src]="avatarPreview" class="avatar-preview" alt="Avatar preview">
          } @else {
            <span class="avatar-preview avatar-preview-fallback">{{ initials }}</span>
          }

        </div>

        <form>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label" >Full Name <span class="text-danger">*</span></label>
              <input disabled class="form-control" name="fullName" [(ngModel)]="fullName" placeholder="Your full name" required>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Email</label>
              <input disabled class="form-control" type="email" name="email" [(ngModel)]="email" placeholder="name@example.com">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Phone Number</label>
              <input disabled class="form-control" name="phoneNumber" [value]="countryCode + ' ' + phoneNumber" placeholder="e.g. +85512345678">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Gender</label>
              <input disabled class="form-control" name="gender" [(ngModel)]="gender" placeholder="Your gender">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Age</label>
              <input disabled class="form-control" name="age" [(ngModel)]="age" placeholder="Your age">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">National ID</label>
              <input disabled class="form-control" name="nationalId" [(ngModel)]="nationalId" placeholder="Your national ID">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Passport Number</label>
              <input disabled class="form-control" name="passportNumber" [(ngModel)]="passportNumber" placeholder="Your passport number">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Line 1</label>
              <input disabled class="form-control" name="line1" [value]="line1" placeholder="Your address">
            </div>
            <!-- Village -->
            <div class="col-12 col-md-6">
              <label class="form-label">Village</label>
              <input
                disabled
                class="form-control"
                name="village"
                [value]="getVillageName(village)"
                placeholder="Your village"
              >
            </div>

            <!-- Commune -->
            <div class="col-12 col-md-6">
              <label class="form-label">Commune</label>
              <input
                disabled
                class="form-control"
                name="commune"
                [value]="getCommuneName(commune)"
                placeholder="Your commune"
              >
            </div>

            <!-- District -->
            <div class="col-12 col-md-6">
              <label class="form-label">District</label>
              <input
                disabled
                class="form-control"
                name="district"
                [value]="getDistrictName(district)"
                placeholder="Your district"
              >
            </div>
            <!-- Province -->
            <div class="col-12 col-md-6">
              <label class="form-label">Province</label>
              <input
                disabled
                class="form-control"
                name="province"
                [value]="getProvinceName(province)"
                placeholder="Your province"
              >
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn btn-primary" (click)="edit()">
                <i class="bi bi-check2 me-1"></i> Edit Profile
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Password -->
  <div class="col-12 col-lg-5">
    <div class="section-card">
      <div class="section-card-header">
        <i class="bi bi-shield-lock"></i>
        <h6>Password</h6>
      </div>
      <div class="section-card-body">

        @if (passwordMessage(); as msg) {
          <div class="alert d-flex align-items-center gap-2 mb-3"
               [class.alert-success]="msg.type === 'success'"
               [class.alert-danger]="msg.type === 'error'">
            <i class="bi" [class.bi-check-circle]="msg.type === 'success'" [class.bi-exclamation-triangle]="msg.type === 'error'"></i>
            <span>{{ msg.text }}</span>
          </div>
        }

        <form (ngSubmit)="changePassword()">
          <div class="mb-3">
            <label class="form-label">Current PIN</label>
            <input class="form-control" type="password" name="currentPassword" [(ngModel)]="currentPassword" placeholder="Enter current PIN" autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label">New PIN</label>
            <input class="form-control" type="password" name="newPassword" [(ngModel)]="newPassword" placeholder="Enter new PIN" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New PIN</label>
            <input class="form-control" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Re-enter new PIN" autocomplete="new-password">
          </div>

          <!-- Requirements checklist -->
          <ul class="password-checklist mb-4">
            <li [class.met]="pinChecks.length"><i class="bi" [class.bi-check-circle-fill]="pinChecks.length" [class.bi-circle]="!pinChecks.length"></i>PINs must be at least 4 digits.</li>
            <!-- <li [class.met]="pinChecks.upperLower"><i class="bi" [class.bi-check-circle-fill]="pinChecks.upperLower" [class.bi-circle]="!pinChecks.upperLower"></i> Upper &amp; lowercase letters</li> -->
            <li [class.met]="pinChecks.number"><i class="bi" [class.bi-check-circle-fill]="pinChecks.number" [class.bi-circle]="!pinChecks.number"></i>PINs must contain at least one number.</li>
            <li [class.met]="pinChecks.match"><i class="bi" [class.bi-check-circle-fill]="pinChecks.match" [class.bi-circle]="!pinChecks.match"></i> PINs match.</li>
          </ul>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary" [disabled]="!pinChecks.match || savingPassword()">
              @if (savingPassword()) {
                <span class="spinner-sm me-1" aria-hidden="true"></span> Updating…
              } @else {
                <i class="bi bi-key me-1"></i> Update PIN
              }
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>
